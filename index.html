<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>PDF Library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mute:#6b7280;--line:#e2e6f0;--acc:#1e3a8a;--onacc:#fff;--danger:#c0392b;--ok:#1a9b55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192033;--tx:#e8ecf5;--mute:#94a0b8;--line:#2a3350;--acc:#7da2ff;--onacc:#0f1420;--danger:#ff7a6b;--ok:#4cd98a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192033;--tx:#e8ecf5;--mute:#94a0b8;--line:#2a3350;--acc:#7da2ff;--onacc:#0f1420;--danger:#ff7a6b;--ok:#4cd98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.4rem;margin:6px 0}
.crumb{color:var(--mute);font-size:.8rem}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:4px}
.sc:active{transform:scale(.98)}
.sc .ic{font-size:1.8rem}.sc .nm{font-size:1.1rem;font-weight:700}.sc .ct{color:var(--mute);font-size:.85rem}
.sc.big{grid-column:1/-1;background:var(--acc);color:var(--onacc);border:none;padding:26px 20px}
.sc.big .ct{color:inherit;opacity:.8}
.bar{display:flex;gap:10px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--onacc);border:none;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
input[type=search],input[type=text],input[type=date]{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;min-width:0}
input[type=search]{flex:1;min-width:140px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;gap:12px;align-items:center}
.info{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;word-break:break-word}
.m{color:var(--mute);font-size:.8rem;margin-top:2px}
.del{background:none;border:1px solid var(--line);color:var(--danger);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.chips{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.rl{color:var(--mute);font-size:.8rem;margin-left:4px}
.rl.full{color:var(--ok);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:36px 10px}
.hidden{display:none!important}
h2{font-size:1rem;margin:20px 0 10px;color:var(--mute)}
.todo{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.todo input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex:none}
.todo .tx{flex:1;min-width:0;word-break:break-word}
.todo.done .tx{text-decoration:line-through;color:var(--mute)}
.late{color:var(--danger)}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#viewer .vb{display:flex;gap:10px;padding:10px;align-items:center}
#viewer .vt{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer iframe{flex:1;border:0;width:100%;background:#fff}
#msg{color:var(--mute);font-size:.8rem;margin-top:16px}
</style>
</head>
<body>
<div class="wrap"><div id="main"></div><div id="msg"></div></div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple class="hidden">
<div id="viewer" class="hidden">
  <div class="vb"><button class="btn ghost" id="vclose">✕ Close</button><div class="vt" id="vtitle"></div><a class="btn" id="vnew" target="_blank" rel="noopener" style="text-decoration:none">Open in tab</a></div>
  <iframe id="vframe" title="PDF"></iframe>
</div>
<script>
const TREE=[
 {id:'gs',name:'GS',icon:'🌍',big:1,kids:[
  {id:'economics',name:'Economics',icon:'💰'},
  {id:'polity',name:'Polity',icon:'🏛️'},
  {id:'history',name:'History',icon:'📜',kids:[{id:'ancient',name:'Ancient',icon:'🏺'},{id:'medieval',name:'Medieval',icon:'🏰'},{id:'modern',name:'Modern',icon:'🚂'}]},
  {id:'geography',name:'Geography',icon:'🗺️'},
  {id:'static',name:'Static GS',icon:'📚'},
  {id:'science',name:'Science',icon:'🔬',kids:[{id:'physics',name:'Physics',icon:'⚛️'},{id:'chemistry',name:'Chemistry',icon:'🧪'},{id:'biology',name:'Biology',icon:'🧬'}]},
  {id:'ecology',name:'Ecology',icon:'🌿'}]},
 {id:'english',name:'English',icon:'📖'},
 {id:'strategy',name:'Strategy',icon:'🎯'},
 {id:'gsmcq',name:'GS MCQs',icon:'✅'},
 {id:'steno',name:'Steno',icon:'⌨️'},
 {id:'reasoning',name:'Reasoning',icon:'🧠'},
 {id:'daily',name:'Daily Revision',icon:'🔁'}
];
let db=null,state={p:[],todo:false},delArm=null,curUrl=null,curKey='';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m)=>db.transaction(n,m||'readonly').objectStore(n);
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const R0=()=>Array(6).fill(null);
function node(p){let l=TREE,n=null;for(const id of p){n=l.find(x=>x.id===id);if(!n)return null;l=n.kids||[]}return n}
function names(p){const o=[];let l=TREE;for(const id of p){const n=l.find(x=>x.id===id);o.push(n.name);l=n.kids||[]}return o}
const cnt=(all,k)=>all.filter(r=>r.subject===k||r.subject.startsWith(k+'.')).length;
function upd(store,id,fn){return new Promise((res,rej)=>{const s=st(store,'readwrite');const g=s.get(id);g.onsuccess=()=>{const r=g.result;if(!r)return res();fn(r);const p=s.put(r);p.onsuccess=()=>res();p.onerror=()=>rej(p.error)};g.onerror=()=>rej(g.error)})}
function openDB(){return new Promise((res,rej)=>{try{
  const r=indexedDB.open('pdf-library',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('files')){d.createObjectStore('files',{keyPath:'id',autoIncrement:true}).createIndex('subject','subject')}
    if(!d.objectStoreNames.contains('todos'))d.createObjectStore('todos',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}})}

function go(p,todo){state={p:p,todo:!!todo};history.pushState(state,'');render()}
window.addEventListener('popstate',e=>{$('viewer').classList.add('hidden');$('vframe').src='about:blank';state=(e.state&&!e.state.v)?e.state:(e.state&&e.state.v?{p:e.state.p,todo:e.state.todo}:{p:[],todo:false});render()});

function backBar(title,crumb){
  const bar=el('div','bar');const b=el('button','btn ghost','← Back');b.onclick=()=>history.back();
  const w=el('div');const h=el('h1',null,title);h.style.margin='0';w.append(h);if(crumb)w.append(el('div','crumb',crumb));
  bar.append(b,w);return bar;
}
async function render(){
  const main=$('main');main.innerHTML='';
  if(!db){main.append(el('div','empty','Storage is not available in this browser, so PDFs cannot be saved.'));return}
  if(state.todo)return renderTodo(main);
  const all=await rq(st('files').getAll());
  const n=state.p.length?node(state.p):null;
  if(!n){
    main.append(el('h1',null,'📚 My PDF Library'));
    const g=el('div','grid');
    TREE.forEach(s=>g.append(card(s,[s.id],all)));
    const todos=await rq(st('todos').getAll());
    const c=el('button','sc');c.append(el('span','ic','📝'),el('span','nm','To-Do List'),el('span','ct',todos.filter(t=>!t.done).length+' pending'));
    c.onclick=()=>go([],true);g.append(c);main.append(g);
    try{const e=await navigator.storage.estimate();$('msg').textContent='Stored on this device: '+fmt(e.usage||0)+'. Files stay in this browser only.'}catch(e){}
    return;
  }
  $('msg').textContent='';
  main.append(backBar(n.icon+' '+n.name,names(state.p).join(' › ')));
  if(n.kids){
    const g=el('div','grid');n.kids.forEach(k=>g.append(card(k,state.p.concat(k.id),all)));main.append(g);
    const key=state.p.join('.');
    if(all.some(r=>r.subject===key)){main.append(el('h2',null,'Unsorted'));const box=el('div');main.append(box);curKey=key;drawList(box,key,'')}
  }else{
    curKey=state.p.join('.');
    const bar=el('div','bar');const add=el('button','btn','+ Add PDFs');add.onclick=()=>$('file').click();
    const q=el('input');q.type='search';q.placeholder='Search PDFs';bar.append(add,q);main.append(bar);
    const box=el('div');main.append(box);q.oninput=()=>drawList(box,curKey,q.value);drawList(box,curKey,'');
  }
}
function card(s,p,all){
  const c=el('button','sc'+(s.big?' big':''));
  c.append(el('span','ic',s.icon),el('span','nm',s.name),el('span','ct',cnt(all,p.join('.'))+' PDFs'));
  c.onclick=()=>go(p);return c;
}
async function drawList(box,key,q){
  box.innerHTML='';
  let rows=await rq(st('files').index('subject').getAll(key));
  q=q.trim().toLowerCase();
  rows=rows.filter(r=>r.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!rows.length){box.append(el('div','empty',q?'No match.':'No PDFs yet. Tap “+ Add PDFs”.'));return}
  rows.forEach(r=>{
    r.rev=r.rev||R0();const done=r.rev.filter(Boolean).length;
    const d=el('div','item'),top=el('div','top'),info=el('div','info');
    info.append(el('div','t','📄 '+r.name.replace(/\.pdf$/i,'')),el('div','m',fmt(r.size)+' · added '+new Date(r.added).toLocaleDateString()));
    info.onclick=()=>openPdf(r);
    const del=el('button','del',delArm===r.id?'Tap again':'Delete');
    del.onclick=async()=>{
      if(delArm===r.id){delArm=null;await rq(st('files','readwrite').delete(r.id));render()}
      else{delArm=r.id;drawList(box,key,q);setTimeout(()=>{if(delArm===r.id){delArm=null;drawList(box,key,q)}},3000)}};
    top.append(info,del);
    const chips=el('div','chips');
    for(let i=0;i<6;i++){
      const b=el('button','chip'+(r.rev[i]?' on':''),String(i+1));
      b.onclick=async()=>{await upd('files',r.id,x=>{x.rev=x.rev||R0();x.rev[i]=x.rev[i]?null:Date.now()});drawList(box,key,q)};
      chips.append(b);
    }
    const last=Math.max(0,...r.rev.filter(Boolean));
    chips.append(el('span','rl'+(done===6?' full':''),done===6?'✅ 6/6 done':done+'/6 revised'+(last?' · last '+new Date(last).toLocaleDateString():'')));
    d.append(top,chips);box.append(d);
  });
}
async function renderTodo(main){
  $('msg').textContent='';
  main.append(backBar('📝 To-Do List'));
  const bar=el('div','bar');
  const t=el('input');t.type='text';t.placeholder='New task…';t.style.flex='1';
  const dt=el('input');dt.type='date';
  const add=el('button','btn','Add');
  add.onclick=async()=>{const v=t.value.trim();if(!v)return;await rq(st('todos','readwrite').add({text:v,due:dt.value||'',done:false,created:Date.now()}));render()};
  t.onkeydown=e=>{if(e.key==='Enter')add.onclick()};
  bar.append(t,dt,add);main.append(bar);
  const rows=await rq(st('todos').getAll());
  rows.sort((a,b)=>(a.done-b.done)||((a.due||'9999')>(b.due||'9999')?1:-1)||a.id-b.id);
  if(!rows.length)main.append(el('div','empty','Nothing here yet. Add your first task.'));
  const today=new Date().toISOString().slice(0,10);
  rows.forEach(r=>{
    const d=el('div','todo'+(r.done?' done':''));
    const c=el('input');c.type='checkbox';c.checked=r.done;
    c.onchange=async()=>{await upd('todos',r.id,x=>{x.done=c.checked});render()};
    const x=el('div','tx',r.text);
    if(r.due){const m=el('div','m'+(!r.done&&r.due<today?' late':''),'Due '+r.due+(!r.done&&r.due<today?' · overdue':''));x.append(m)}
    const del=el('button','del','✕');del.onclick=async()=>{await rq(st('todos','readwrite').delete(r.id));render()};
    d.append(c,x,del);main.append(d);
  });
  if(rows.some(r=>r.done)){const cl=el('button','btn ghost','Clear completed');cl.style.marginTop='10px';
    cl.onclick=async()=>{for(const r of rows.filter(r=>r.done))await rq(st('todos','readwrite').delete(r.id));render()};main.append(cl)}
}
function openPdf(r){
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(new Blob([r.blob],{type:'application/pdf'}));
  $('vtitle').textContent=r.name;$('vnew').href=curUrl;$('vframe').src=curUrl;
  history.pushState({v:1,p:state.p,todo:state.todo},'');$('viewer').classList.remove('hidden');
}
$('vclose').onclick=()=>history.back();
$('file').onchange=async e=>{
  const files=[...e.target.files];if(!db||!files.length)return;
  for(const f of files){
    try{await rq(st('files','readwrite').add({subject:curKey,name:f.name,size:f.size,added:Date.now(),blob:f,rev:R0()}))}
    catch(err){alert('Could not save "'+f.name+'". Storage may be full.')}
  }
  e.target.value='';render();
};
(async()=>{
  try{db=await openDB();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){db=null}
  history.replaceState(state,'');render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
